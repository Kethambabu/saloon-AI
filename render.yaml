# ==============================================================================
# Render Blueprint Specification (Infrastructure-as-Code)
# Deploys SalonAI Backend & Frontend on Render with Docker
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend Web Service (FastAPI + AI Multi-Agent Engine)
  # ----------------------------------------------------------------------------
  - type: web
    name: salonai-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOW_MEMORY_MODE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard (e.g., Supabase PostgreSQL or Render Postgres)
      - key: CORS_ORIGINS
        sync: false # Set in Render Dashboard (e.g., https://salonai-frontend.onrender.com)
      - key: GROQ_API_KEY
        sync: false # Required for LLM Agents
      - key: OPENAI_API_KEY
        sync: false # Optional: If using OpenAI models
      - key: SUPABASE_URL
        sync: false # Optional: If using Supabase Storage/Auth
      - key: SUPABASE_KEY
        sync: false # Optional: If using Supabase Storage/Auth

  # ----------------------------------------------------------------------------
  # Frontend Web Service (React + Vite + Nginx SPA)
  # ----------------------------------------------------------------------------
  - type: web
    name: salonai-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    dockerBuildArgs:
      - key: VITE_API_URL
        value: https://salonai-backend.onrender.com/api/v1
